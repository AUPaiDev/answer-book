name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax & Module Check
        run: |
          node --check server.js
          node --check pages.js
          node -e "const p = require('./pages.js'); if(!p.BOOK_PAGES || p.BOOK_PAGES.length !== 365) throw new Error('Invalid pages'); console.log('✅ Pages check passed:', p.BOOK_PAGES.length);"

  build-and-push-image:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: MINIMAX_API_KEY
          script: |
            APP_DIR="/home/${{ secrets.SERVER_USER || 'ubuntu' }}/apps/answer-book"
            mkdir -p ${APP_DIR}
            cd ${APP_DIR}

            # 若配置了 MINIMAX_API_KEY，写入 .env
            if [ -n "$MINIMAX_API_KEY" ]; then
              cat > .env << ENVEOF
            MINIMAX_API_KEY=$MINIMAX_API_KEY
            PORT=3900
            ENVEOF
            fi

            echo "📄 0. 同步最新生产 docker-compose 配置..."
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.prod.yml -o docker-compose.prod.yml

            echo "📥 1. 拉取最新 Docker 镜像..."
            docker compose -f docker-compose.prod.yml pull || sudo docker compose -f docker-compose.prod.yml pull

            echo "🚀 2. 升级并重启容器..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans || sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "🩺 3. 服务健康检查..."
            sleep 3
            curl -s http://localhost:3003/api/health || echo "服务启动中..."

            echo ""
            echo "🧹 4. 清理旧镜像..."
            docker image prune -f || sudo docker image prune -f || true

            echo "✅ 部署完成! http://${{ secrets.SERVER_HOST }}:3003"
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
